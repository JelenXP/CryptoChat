name: Build chat APK

# Sestaví chatovou Android appku (klient v Client/). Běží s internetem, takže
# umí stáhnout nové závislosti (kmp-tor pro zabudovaný Tor apod.) a ověřit, že
# se appka opravdu sestaví - lokální offline stroj to neumí.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'Client/**'
      - '.github/workflows/build-chat-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Unit testy jedou PŘED buildem: čistě JVM (ChatEnvelope, Pairing, krypto)
      # i Robolectric (RelayCrypto, ReplayGuard, BlobQuarantine, WireCompat stav).
      # Robolectric si stahuje android-all jar - proto to jde jen tady, kde je síť.
      # Selhání testu shodí celý workflow (build APK se ani nespustí).
      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: Client/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoChatOnline-debug-apk
          path: Client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
