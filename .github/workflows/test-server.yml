name: Test relay server

# Testy relay serveru (server.py) - jadro zaruky proti ztrate zpravy (peek/ack/seq/
# strankovani/eviction). Ciste Python stdlib, zadne zavislosti.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'server.py'
      - 'test_server.py'
      - '.github/workflows/test-server.yml'
  pull_request:
    paths:
      - 'server.py'
      - 'test_server.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run server tests
        run: python -m unittest test_server -v
